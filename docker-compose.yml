# Личное имя проекта Compose
name: kadyrbekov-bek-student-api

services:
  app:
    build: .
    image: kadyrbekov-bek-student-api:v1.0-35534
    container_name: kadyrbekov-bek-app
    ports:
      - "8081:8080"            # 8080 на хосте занят Jenkins
    environment:
      # ВАЖНО: хост БД — имя сервиса "db", а не localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-studentdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-student}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      STUDENT_NAME: Bek Kadyrbekov
      STUDENT_GROUP: IT2-2306
      STUDENT_ID: "35534"
      APP_VERSION: "1.0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kadyrbekov-net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: kadyrbekov-bek-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studentdb}
      POSTGRES_USER: ${POSTGRES_USER:-student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - kadyrbekov-pgdata:/var/lib/postgresql/data
    networks:
      - kadyrbekov-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-student} -d ${POSTGRES_DB:-studentdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kadyrbekov-pgdata:

networks:
  kadyrbekov-net:
    name: kadyrbekov-net
