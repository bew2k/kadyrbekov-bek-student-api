server.port=8080

# Подключение к БД. Значения берутся из переменных окружения (docker-compose.yml).
# Хост по умолчанию — имя сервиса Compose "db", а не localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Данные студента (отображаются при старте и в /api/info)
student.name=${STUDENT_NAME:Bek Kadyrbekov}
student.group=${STUDENT_GROUP:IT2-2306}
student.id=${STUDENT_ID:35534}
app.version=${APP_VERSION:1.0}
